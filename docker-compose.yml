services:
  task-api:
    build:
      context: ./01-backend-clean-architecture
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  dispatch-api:
    build:
      context: ./05-realtime-dispatch-systems
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5090:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: portfolio_orders
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${PORTFOLIO_DB_PASSWORD:?Set PORTFOLIO_DB_PASSWORD before starting Compose}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - orders-data:/var/lib/postgresql/data
      - ./06-database-optimization/sql/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio_orders"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  database-api:
    build:
      context: ./06-database-optimization
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5091:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Orders: Host=database;Port=5432;Database=portfolio_orders;Username=portfolio;Password=${PORTFOLIO_DB_PASSWORD:?Set PORTFOLIO_DB_PASSWORD before starting Compose}
    depends_on:
      database:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  orders-data:
