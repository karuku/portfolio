name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET reference modules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x
      - name: Restore
        run: dotnet restore architectural-patterns/ArchitecturalPatterns.sln && dotnet restore ai-backend-bridge/AiBackendBridge.sln
      - name: Verify formatting
        run: dotnet format architectural-patterns/ArchitecturalPatterns.sln --verify-no-changes --no-restore && dotnet format ai-backend-bridge/AiBackendBridge.sln --verify-no-changes --no-restore
      - name: Build
        run: dotnet build architectural-patterns/ArchitecturalPatterns.sln --no-restore --configuration Release && dotnet build ai-backend-bridge/AiBackendBridge.sln --no-restore --configuration Release
      - name: Test
        run: dotnet test architectural-patterns/ArchitecturalPatterns.sln --no-build --configuration Release --verbosity normal && dotnet test ai-backend-bridge/AiBackendBridge.sln --no-build --configuration Release --verbosity normal

  typescript:
    name: TypeScript patterns
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: react-patterns
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react-patterns/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  container:
    name: Container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify Compose service
        run: |
          set -euo pipefail
          cleanup() {
            docker compose logs --no-color || true
            docker compose down --volumes --remove-orphans
          }
          trap cleanup EXIT

          docker compose up --build --detach --wait --wait-timeout 60
          response="$(curl --fail --silent --show-error \
            --header 'Content-Type: application/json' \
            --data '{"title":"CI smoke test"}' \
            http://localhost:5080/tasks)"
          printf '%s' "$response" | jq --exit-status '.title == "CI smoke test"'
          curl --fail --silent --show-error http://localhost:5080/tasks \
            | jq --exit-status 'any(.[]; .title == "CI smoke test")'

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/lychee-action@v2
        with:
          args: '--no-progress README.md docs/*.md architectural-patterns/README.md ai-backend-bridge/README.md react-patterns/README.md'
          fail: true
