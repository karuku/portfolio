name: CodeQL

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x
      - if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            02-frontend-react-patterns/package-lock.json
            03-mobile-react-native/package-lock.json
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - name: Build .NET modules
        if: matrix.language == 'csharp'
        run: dotnet build 01-backend-clean-architecture/ArchitecturalPatterns.sln --configuration Release && dotnet build 04-ai-llm-integration/AiBackendBridge.sln --configuration Release && dotnet build 05-realtime-dispatch-systems/DispatchSystems.sln --configuration Release && dotnet build 06-database-optimization/DatabaseOptimization.sln --configuration Release
      - name: Install TypeScript dependencies
        if: matrix.language == 'javascript-typescript'
        working-directory: 02-frontend-react-patterns
        run: npm ci
      - name: Install Expo dependencies
        if: matrix.language == 'javascript-typescript'
        working-directory: 03-mobile-react-native
        run: npm ci
      - uses: github/codeql-action/analyze@v3